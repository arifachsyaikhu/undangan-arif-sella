<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow-x: hidden;
        }

        /* Container Utama Undangan */
        .invitation-card {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 840px;
            background: url('texture-paper.jpg') center/cover no-repeat;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 40px;
            border-radius: 12px;
        }

        /* Bingkai Ukiran Gebyok Jawa */
        .gebyok-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('gebyok-frame.jpg') center/100% 100% no-repeat;
            pointer-events: none;
            z-index: 5;
        }

        /* Hiasan Janur Kuning di Samping Top Left & Right */
        .janur-left, .janur-right {
            position: absolute;
            top: -20px;
            width: 90px;
            height: auto;
            z-index: 6;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }

        .janur-left {
            left: -10px;
            transform: scaleX(-1) rotate(15deg);
        }

        .janur-right {
            right: -10px;
            transform: rotate(15deg);
        }

        /* Hiasan Bunga Burgundy di Sudut Bawah */
        .flower-burgundy-bottom {
            position: absolute;
            bottom: -10px;
            right: -10px;
            width: 220px;
            z-index: 6;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            pointer-events: none;
        }

        .flower-burgundy-top {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 180px;
            transform: rotate(180deg);
            z-index: 6;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            pointer-events: none;
        }

        /* Canvas Animasi Kupu-Kupu Transparan (Chroma Key) */
        #butterflyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; /* Di atas elemen isi undangan */
            pointer-events: none;
        }

        /* Konten Isi Undangan */
        .content {
            position: relative;
            z-index: 4;
            text-align: center;
            color: #4a2c11;
            margin-top: 40px;
            width: 100%;
        }

        .gunungan-logo {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            animation: pulseGunungan 3s infinite ease-in-out;
        }

        @keyframes pulseGunungan {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #7a1c1c;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .mempelai {
            font-family: 'Pinyon Script', 'Brush Script MT', cursive, serif;
            font-size: 36px;
            color: #5c0612;
            margin: 15px 0;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .ampersand {
            font-size: 24px;
            color: #8b0000;
            display: block;
            margin: 5px 0;
        }

        .date-box {
            border-top: 1px solid #8b0000;
            border-bottom: 1px solid #8b0000;
            padding: 10px 0;
            margin: 20px 0;
            font-size: 14px;
            color: #333;
            letter-spacing: 1px;
        }

        .btn-open {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 25px;
            background-color: #7a1c1c;
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(122, 28, 28, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-open:hover {
            background-color: #5c0612;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="gebyok-frame"></div>
        <img src="janur-hanging.png" class="janur-left" alt="Janur Kiri">
        <img src="janur-hanging.png" class="janur-right" alt="Janur Kanan">
        <img src="flower-burgundy.jpg" class="flower-burgundy-top" alt="Bunga Atas">
        <img src="flower-burgundy.jpg" class="flower-burgundy-bottom" alt="Bunga Bawah">

        <canvas id="butterflyCanvas"></canvas>

        <video id="butterflyVideo" src="butterfly.mp4" autoplay loop muted playsinline style="display: none;"></video>

        <div class="content">
            <img src="gunungan-logo.png" class="gunungan-logo" alt="Logo Gunungan Jawa">
            <p class="subtitle">UNDANGAN PERNIKAHAN</p>

            <h1 class="mempelai">Raden Mas Arya</h1>
            <span class="ampersand">&</span>
            <h1 class="mempelai">Nimas Ayu Lestari</h1>

            <div class="date-box">
                <p>SABTU, 24 OKTOBER 2026</p>
                <p style="font-size: 12px; margin-top: 4px; color: #666;">GEDUNG AGUNG YOGYAKARTA</p>
            </div>

            <button class="btn-open" onclick="playAudio()">Buka Undangan</button>
        </div>
    </div>

    <script>
        // JS Chroma Key (Menghapus latar hijau/green screen dari video butterfly.mp4)
        const video = document.getElementById('butterflyVideo');
        const canvas = document.getElementById('butterflyCanvas');
        const ctx = canvas.getContext('2d');

        function processChromaKey() {
            if (video.paused || video.ended) {
                requestAnimationFrame(processChromaKey);
                return;
            }

            // Sesuaikan ukuran canvas dengan tampilan elemen
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            // Gambar frame video ke canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Ambil data piksel canvas
            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let length = frame.data.length;

            // Algoritma Chroma Key (Filter warna hijau)
            for (let i = 0; i < length; i += 4) {
                let r = frame.data[i];
                let g = frame.data[i + 1];
                let b = frame.data[i + 2];

                // Deteksi warna hijau dominan (Green Screen)
                if (g > 90 && r < 130 && b < 130 && g > r * 1.15 && g > b * 1.15) {
                    frame.data[i + 3] = 0; // Buat piksel hijau menjadi transparan
                }
            }

            // Tampilkan kembali piksel yang sudah diproses
            ctx.putImageData(frame, 0, 0);

            requestAnimationFrame(processChromaKey);
        }

        // Jalankan proses saat video mulai diputar
        video.addEventListener('play', () => {
            requestAnimationFrame(processChromaKey);
        });

        // Pastikan video otomatis memutar saat dimuat
        window.addEventListener('load', () => {
            video.play().catch(err => {
                console.log("Autoplay dicegah oleh browser, membutuhkan interaksi pengguna.");
            });
        });

        function playAudio() {
            alert("Membuka Undangan...");
        }
    </script>
</body>
</html>
